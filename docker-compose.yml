# Local/dev stack: SQL Server + API + web (nginx serving the SPA and proxying /api).
#   docker compose up -d db
#   docker compose run --rm api python -m app.db.create_database
#   docker compose run --rm api alembic upgrade head
#   docker compose up --build
# Then open http://localhost:8080
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Dev_only_Passw0rd
    ports: ["1433:1433"]
    volumes: ["mssqldata:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Dev_only_Passw0rd -Q 'SELECT 1'"]
      interval: 10s
      retries: 12

  api:
    build: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: mssql+pyodbc://sa:Dev_only_Passw0rd@db:1433/resume_intel?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      STORAGE_LOCAL_ROOT: /app/var/storage
      # Trust X-Forwarded-For only from the web container's network.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db: { condition: service_healthy }
    volumes: ["storage:/app/var/storage"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 10s
      retries: 5

  web:
    build: ./frontend
    ports: ["8080:8080"]
    depends_on: [api]

volumes:
  mssqldata:
  storage:

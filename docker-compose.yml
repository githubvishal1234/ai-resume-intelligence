# Local/dev stack: Postgres + API + web (nginx serving the SPA and proxying /api).
#   docker compose up -d db
#   docker compose run --rm api alembic upgrade head
#   docker compose up --build
# Then open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resume_app
      POSTGRES_PASSWORD: dev_only_password
      POSTGRES_DB: resume_intel
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_app -d resume_intel"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://resume_app:dev_only_password@db:5432/resume_intel
      STORAGE_LOCAL_ROOT: /app/var/storage
      # Trust X-Forwarded-For only from the web container's network.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db: { condition: service_healthy }
    volumes: ["storage:/app/var/storage"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 10s
      retries: 5

  web:
    build: ./frontend
    ports: ["8080:8080"]
    depends_on: [api]

volumes:
  pgdata:
  storage:

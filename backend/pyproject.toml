[project]
name = "resume-intel-backend"
version = "0.1.0"
description = "Backend for the AI Resume Intelligence Platform (product name pending company approval)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pyodbc>=5.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "email-validator>=2.1",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "reportlab>=4.2",
  "pillow>=13.0",  # profile photos: re-encoding uploads and the round crop in PDFs
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2.0", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.output" = ["fonts/*.ttf", "fonts/LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4"]
ignore = ["S101"]  # assert is fine in tests; app code does not rely on it for validation

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["argon2.*", "docx.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

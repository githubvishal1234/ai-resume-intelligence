# Serves the SPA and proxies /api to the backend so both share one origin (no CORS needed).
server {
  listen 8080;
  root /usr/share/nginx/html;
  client_max_body_size 12m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed file names, so long caching is safe. (No add_header here: it would drop the
  # server-level security headers, because nginx does not merge add_header across levels.)
  location /assets/ {
    expires 1y;
  }

  location / {
    try_files $uri /index.html;
  }
}

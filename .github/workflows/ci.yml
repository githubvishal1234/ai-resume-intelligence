name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Dev_only_Passw0rd
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Dev_only_Passw0rd -Q 'SELECT 1'"
          --health-interval 10s --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: mssql+pyodbc://sa:Dev_only_Passw0rd@localhost:1433/resume_intel_test?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Microsoft ODBC Driver 18
        run: |
          if ! odbcinst -q -d | grep -q "ODBC Driver 18 for SQL Server"; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update && sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
          fi
      - run: pip install -r requirements.lock -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: DATABASE_URL=$TEST_DATABASE_URL python -m app.db.create_database
      - run: pytest
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.lock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ../backend
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: API types are in sync with the backend
        run: PYTHON=python npm run check:api
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    # A real browser against the real API and database: sign up, import, match, tailor, PDF.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Dev_only_Passw0rd
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Dev_only_Passw0rd -Q 'SELECT 1'"
          --health-interval 10s --health-retries 12
    defaults:
      run:
        working-directory: frontend
    env:
      DATABASE_URL: mssql+pyodbc://sa:Dev_only_Passw0rd@localhost:1433/resume_intel_e2e?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Microsoft ODBC Driver 18
        run: |
          if ! odbcinst -q -d | grep -q "ODBC Driver 18 for SQL Server"; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            curl -fsSL "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update && sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
          fi
      - run: pip install -r ../backend/requirements.lock -e ../backend
      - run: python -m app.db.create_database
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          STORAGE_LOCAL_ROOT: ${{ runner.temp }}/storage
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

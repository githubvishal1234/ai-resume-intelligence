name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: resume_app
          POSTGRES_PASSWORD: dev_only_password
          POSTGRES_DB: resume_intel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U resume_app" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://resume_app:dev_only_password@localhost:5432/resume_intel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.lock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ../backend
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: API types are in sync with the backend
        run: PYTHON=python npm run check:api
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    # A real browser against the real API and database: sign up, import, match, tailor, PDF.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: resume_app
          POSTGRES_PASSWORD: dev_only_password
          POSTGRES_DB: resume_intel_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U resume_app" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: frontend
    env:
      DATABASE_URL: postgresql+psycopg://resume_app:dev_only_password@localhost:5432/resume_intel_e2e
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ../backend/requirements.lock -e ../backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          STORAGE_LOCAL_ROOT: ${{ runner.temp }}/storage
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
